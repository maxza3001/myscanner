<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA Settings (ส่วนที่ทำให้ซ่อนแถบ URL เมื่อ Add to Home Screen) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ScannerPro">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href='data:application/json,{"name":"Scanner Pro","short_name":"Scanner","start_url":".","display":"standalone","background_color":"#ffffff","theme_color":"#2563eb"}'>
    
    <title>Super Scanner</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <!-- HTML5-QRCode Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- QR Code Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- JsBarcode Generator -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap');
        body { 
            font-family: 'Sarabun', sans-serif; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; }
        #reader video { border-radius: 0.75rem; object-fit: cover; }
        #reader__scan_region { background: rgba(0,0,0,0.1) !important; }
        #reader__dashboard { display: none !important; }
        @keyframes shake { 0%, 100% { transform: translateX(-50%) translateX(0); } 20%, 60% { transform: translateX(-50%) translateX(-5px); } 40%, 80% { transform: translateX(-50%) translateX(5px); } }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        .whitespace-pre-wrap { white-space: pre-wrap; word-break: break-all; }
        
        /* ซ่อน Scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm p-4 sticky top-0 z-50 flex justify-between items-center border-b">
        <div class="w-10 text-blue-600">
             <i class="fas fa-qrcode text-lg"></i>
        </div>
        <h1 class="text-xl font-bold text-gray-800 tracking-tight">Scanner Pro 📱</h1>
        <div class="w-10 flex justify-center">
             <button id="torch-button" onclick="toggleTorch()" class="hidden text-gray-600 focus:outline-none bg-gray-100 p-2 rounded-full">
                <i class="fas fa-lightbulb"></i>
             </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-white border-b flex justify-around p-2 text-xs z-40">
        <button onclick="switchTab('scan')" id="tab-scan" class="tab-active flex-1 py-3 font-bold text-center">
            <i class="fas fa-expand-alt mb-1 block text-base"></i> สแกนเดี่ยว
        </button>
        <button onclick="switchTab('batch')" id="tab-batch" class="flex-1 py-3 font-bold text-gray-400 text-center">
            <i class="fas fa-layer-group mb-1 block text-base"></i> สแกนชุด
        </button>
        <button onclick="switchTab('generate')" id="tab-generate" class="flex-1 py-3 font-bold text-gray-400 text-center">
            <i class="fas fa-plus-circle mb-1 block text-base"></i> สร้างโค้ด
        </button>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow p-4 overflow-y-auto">
        <div id="notification" class="hidden fixed top-24 left-1/2 transform -translate-x-1/2 text-white px-6 py-2 rounded-full shadow-2xl z-[100] transition-all duration-300 font-bold text-sm"></div>

        <!-- Scanner View -->
        <div id="scanner-section" class="mb-4">
            <div id="reader" class="w-full bg-black rounded-xl overflow-hidden min-h-[300px] shadow-2xl border-2 border-white relative"></div>
            <div class="flex justify-between items-center mt-3 px-2">
                <p class="text-[11px] text-gray-500 font-medium"><i class="fas fa-info-circle mr-1"></i> วางโค้ดในกรอบสี่เหลี่ยม</p>
                <span id="camera-status" class="text-[10px] bg-green-100 text-green-600 px-2 py-1 rounded-full font-bold uppercase">กล้องพร้อมใช้งาน</span>
            </div>
        </div>

        <!-- Single View Content -->
        <div id="view-scan" class="block space-y-4">
            <div id="single-result-card" class="bg-white p-5 rounded-2xl shadow-sm hidden border border-gray-100">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-gray-400 text-[10px] font-black uppercase tracking-tighter">ผลการสแกน</h3>
                    <div class="flex gap-2">
                        <button onclick="shareText('scan-result-text')" class="text-blue-600 bg-blue-50 p-2 rounded-lg text-xs"><i class="fas fa-share-alt"></i></button>
                        <button onclick="copyToClipboard('scan-result-text')" class="text-green-600 bg-green-50 p-2 rounded-lg text-xs"><i class="fas fa-copy"></i></button>
                    </div>
                </div>
                <div class="text-lg font-mono text-gray-900 leading-tight font-semibold whitespace-pre-wrap bg-gray-50 p-4 rounded-xl border border-gray-100" id="scan-result-text">-</div>
            </div>
            
            <!-- PWA Instruction -->
            <div id="pwa-install-msg" class="bg-blue-50 p-4 rounded-xl border border-blue-100 text-xs text-blue-700">
                <p class="font-bold mb-1"><i class="fas fa-mobile-alt mr-1"></i> วิธีซ่อนแถบ URL:</p>
                <p>กดปุ่ม "แชร์" (iOS) หรือ "จุด 3 จุด" (Android) แล้วเลือก "เพิ่มไปยังหน้าจอโฮม" เพื่อใช้งานแบบแอปเต็มหน้าจอ</p>
            </div>
        </div>

        <!-- Batch View Content -->
        <div id="view-batch" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-gray-800 text-sm uppercase tracking-wider">รายการสะสม (<span id="batch-count" class="text-blue-600">0</span>)</h3>
                <button onclick="clearBatch()" class="text-red-500 text-xs font-black uppercase">ล้างทั้งหมด</button>
            </div>
            <ul id="batch-list" class="bg-white rounded-2xl shadow-sm divide-y divide-gray-50 max-h-72 overflow-y-auto mb-6 border border-gray-100">
                <li class="p-8 text-center text-gray-400 text-sm italic">ยังไม่มีรายการสแกน</li>
            </ul>
            <button onclick="generateMasterCode()" class="w-full bg-blue-600 text-white py-4 rounded-2xl shadow-xl font-black text-lg active:scale-95 transition">
                สร้าง Master QR (แยกบรรทัด)
            </button>
        </div>

        <!-- Generate View Content -->
        <div id="view-generate" class="hidden">
            <div id="generated-output" class="bg-white p-8 rounded-2xl shadow-sm flex flex-col items-center justify-center mb-6 hidden border-t-8 border-blue-500">
                <div id="qrcode-container" class="p-2 bg-white rounded-lg shadow-inner"></div>
                <svg id="barcode-container" class="mb-4 hidden w-full"></svg>
                <p id="generated-text-display" class="text-center font-mono text-[10px] text-gray-500 my-4 px-6 bg-gray-50 py-2 rounded-lg whitespace-pre-wrap w-full border border-gray-100"></p>
                <div class="grid grid-cols-2 gap-2 w-full">
                    <button onclick="copyToClipboard('generated-text-display')" class="text-gray-600 text-xs font-bold border-2 border-gray-100 px-4 py-3 rounded-xl">คัดลอกข้อความ</button>
                    <button onclick="downloadCode()" class="bg-blue-600 text-white text-xs font-bold px-4 py-3 rounded-xl">บันทึกรูปภาพ</button>
                </div>
            </div>
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                <label class="block text-gray-400 text-[10px] font-black uppercase mb-2">สร้างรหัสด้วยตนเอง</label>
                <textarea id="manual-input" class="w-full border-2 border-gray-50 rounded-xl p-4 mb-4 outline-none transition font-mono text-sm h-24" placeholder="พิมพ์ข้อความที่นี่..."></textarea>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="createManualCode('qr')" class="bg-gray-800 text-white py-4 rounded-xl font-black text-sm active:scale-95 transition">สร้าง QR Code</button>
                    <button onclick="createManualCode('barcode')" class="bg-gray-800 text-white py-4 rounded-xl font-black text-sm active:scale-95 transition">สร้าง Barcode</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        let currentTab = 'scan';
        let batchItems = [];
        let html5QrCode = null;
        let isScanning = true;
        let isTorchOn = false;
        let cameraId = null;
        const DELIMITER = '\n';

        window.addEventListener('load', () => {
            initApp();
            if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('pwa-install-msg').classList.add('hidden');
            }
        });

        async function initApp() {
            try {
                const devices = await Html5Qrcode.getCameras();
                if (devices && devices.length > 0) {
                    const backCamera = devices.find(device => device.label.toLowerCase().includes('back') || device.label.toLowerCase().includes('rear'));
                    cameraId = backCamera ? backCamera.id : devices[0].id;
                    startScanner();
                } else {
                    updateStatus("ไม่พบกล้อง", "text-red-600", "bg-red-100");
                }
            } catch (err) {
                updateStatus("ขอสิทธิ์ใช้กล้องไม่สำเร็จ", "text-red-600", "bg-red-100");
            }
        }

        async function startScanner() {
            if (html5QrCode) return;
            html5QrCode = new Html5Qrcode("reader");
            const config = { 
                fps: 25, 
                qrbox: (w, h) => {
                    const size = Math.floor(Math.min(w, h) * 0.7);
                    return { width: size, height: size };
                },
                aspectRatio: 1.0
            };
            try {
                await html5QrCode.start(cameraId, config, onScanSuccess);
                checkTorchSupport();
            } catch (err) { console.error(err); }
        }

        function onScanSuccess(decodedText) {
            if (!isScanning) return;
            if (currentTab === 'scan') {
                playSuccessChime();
                handleSingleScan(decodedText);
            } else if (currentTab === 'batch') {
                handleBatchScan(decodedText);
            }
        }

        function handleSingleScan(text) {
            isScanning = false;
            setTimeout(() => isScanning = true, 2000);
            document.getElementById('scan-result-text').innerText = text;
            document.getElementById('single-result-card').classList.remove('hidden');
            showNotification('สแกนสำเร็จ!', 'bg-blue-600');
        }

        function handleBatchScan(text) {
            if (batchItems.includes(text)) {
                playErrorChime();
                showNotification(`⚠️ รหัสซ้ำ: ${text}`, 'bg-red-500', true);
                isScanning = false;
                setTimeout(() => isScanning = true, 1500);
                return;
            }
            batchItems.push(text);
            updateBatchList();
            playSuccessChime();
            showNotification(`บันทึกรหัสใหม่แล้ว`, 'bg-green-600');
            isScanning = false;
            setTimeout(() => isScanning = true, 1000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('nav button').forEach(btn => {
                btn.className = "flex-1 py-3 font-bold text-gray-400 text-center";
            });
            document.getElementById(`tab-${tab}`).className = "tab-active flex-1 py-3 font-bold text-center";
            
            document.getElementById('view-scan').style.display = tab === 'scan' ? 'block' : 'none';
            document.getElementById('view-batch').style.display = tab === 'batch' ? 'block' : 'none';
            document.getElementById('view-generate').style.display = tab === 'generate' ? 'block' : 'none';
            
            if (tab === 'generate') {
                document.getElementById('scanner-section').classList.add('hidden');
                if (html5QrCode) html5QrCode.pause();
            } else {
                document.getElementById('scanner-section').classList.remove('hidden');
                if (html5QrCode) html5QrCode.resume();
            }
        }

        function playSuccessChime() {
            playTone(880, 0.1, 0.1, "sine");
            if (navigator.vibrate) navigator.vibrate(40);
        }

        function playErrorChime() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = "sawtooth";
            osc.frequency.setValueAtTime(150, ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.4);
            g.gain.linearRampToValueAtTime(0.2, ctx.currentTime + 0.05);
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4);
            osc.connect(g); g.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.4);
            if (navigator.vibrate) navigator.vibrate([200, 50, 200]);
        }

        function playTone(freq, duration, volume, type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = type;
                osc.connect(g); g.connect(ctx.destination);
                osc.frequency.value = freq;
                g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
                osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e){}
        }

        function updateStatus(text, textColor, bgColor) {
            const el = document.getElementById('camera-status');
            el.innerText = text;
            el.className = `text-[10px] ${bgColor} ${textColor} px-2 py-1 rounded-full font-bold uppercase`;
        }

        function showNotification(msg, color, shake = false) {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.className = `fixed top-24 left-1/2 transform -translate-x-1/2 text-white px-8 py-3 rounded-full shadow-2xl z-[100] transition-all duration-300 font-black text-sm ${color}`;
            if (shake) el.classList.add('animate-shake'); else el.classList.remove('animate-shake');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2000);
        }

        function updateBatchList() {
            const list = document.getElementById('batch-list');
            document.getElementById('batch-count').innerText = batchItems.length;
            if (batchItems.length === 0) { list.innerHTML = '<li class="p-8 text-center text-gray-400 text-sm italic">ยังไม่มีรายการ</li>'; return; }
            list.innerHTML = batchItems.map((item, idx) => `
                <li class="p-4 flex justify-between items-center">
                    <div class="min-w-0 pr-4">
                        <div class="text-[10px] text-gray-400 font-black mb-1">ลำดับ #${idx+1}</div>
                        <div class="text-xs font-mono truncate font-bold">${item}</div>
                    </div>
                    <button onclick="removeBatchItem(${idx})" class="text-red-400 bg-red-50 p-2 rounded-lg"><i class="fas fa-trash-alt"></i></button>
                </li>`).join('');
        }

        function removeBatchItem(idx) { batchItems.splice(idx, 1); updateBatchList(); }
        function clearBatch() { if(confirm('ต้องการล้างข้อมูลสะสมทั้งหมดหรือไม่?')) { batchItems = []; updateBatchList(); } }
        
        function generateMasterCode() { 
            if (batchItems.length === 0) return showNotification('ไม่มีข้อมูล', 'bg-red-500');
            switchTab('generate'); 
            renderQRCode(batchItems.join(DELIMITER)); 
        }

        function renderQRCode(text) { 
            const container = document.getElementById('qrcode-container'); 
            const barcodeContainer = document.getElementById('barcode-container');
            container.innerHTML = ""; 
            barcodeContainer.classList.add('hidden');
            document.getElementById('generated-output').classList.remove('hidden'); 
            document.getElementById('generated-text-display').innerText = text; 
            new QRCode(container, { text, width: 220, height: 220, correctLevel : QRCode.CorrectLevel.M }); 
        }

        async function checkTorchSupport() { try { const state = await html5QrCode.getTorchState(); if (state !== undefined) document.getElementById('torch-button').classList.remove('hidden'); } catch(e){} }
        async function toggleTorch() { isTorchOn = !isTorchOn; await html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] }); }
        
        function copyToClipboard(id) { 
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text).then(() => showNotification('คัดลอกลงคลิปบอร์ดแล้ว', 'bg-gray-800')); 
        }

        function shareText(id) {
            const text = document.getElementById(id).innerText;
            if (navigator.share) {
                navigator.share({ title: 'Shared Scan', text: text });
            } else {
                copyToClipboard(id);
            }
        }

        function createManualCode(type) { 
            const val = document.getElementById('manual-input').value; 
            if (!val) return;
            if (type === 'qr') renderQRCode(val); 
            else { 
                document.getElementById('qrcode-container').innerHTML = ""; 
                const bc = document.getElementById('barcode-container');
                bc.classList.remove('hidden'); 
                document.getElementById('generated-output').classList.remove('hidden');
                document.getElementById('generated-text-display').innerText = val;
                JsBarcode("#barcode-container", val, { width: 2, height: 80, displayValue: false }); 
            } 
        }

        function downloadCode() { 
            const canvas = document.querySelector('#qrcode-container canvas'); 
            if(canvas) {
                const link = document.createElement('a');
                link.download = `QR_Code_${Date.now()}.png`;
                link.href = canvas.toDataURL();
                link.click();
            }
        }
    </script>
</body>
</html>
